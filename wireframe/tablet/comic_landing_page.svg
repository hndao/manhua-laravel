  <text x="24" y="700" class="title">热门连载 / Hot Serials</text>
  <rect x="24" y="710" width="720" height="260" fill="#FFFFFF" stroke="#DDDDDD" rx="8"/>

  <!-- 3 columns x 2 rows -->
  <!-- Row 1 -->
  <rect x="36" y="725" width="120" height="150" fill="#FFFFFF" stroke="#CCCCCC" rx="4"/>
  <text x="170" y="750" class="label">Title A</text>
  <text x="170" y="770" class="small">Tag / Chapter</text>

  <rect x="276" y="725" width="120" height="150" fill="#FFFFFF" stroke="#CCCCCC" rx="4"/>
  <text x="410" y="750" class="label">Title B</text>
  <text x="410" y="770" class="small">Tag / Chapter</text>

  <rect x="516" y="725" width="120" height="150" fill="#FFFFFF" stroke="#CCCCCC" rx="4"/>
  <text x="650" y="750" class="label">Title C</text>
  <text x="650" y="770" class="small">Tag / Chapter</text>

  <!-- Daily Updates -->
