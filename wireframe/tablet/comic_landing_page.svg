  <text x="130" y="1086" class="small">Chapter X</text>
  <text x="130" y="1104" class="small">Today 10:00</text>

  <rect x="36" y="1165" width="80" height="100" fill="#FFFFFF" stroke="#CCCCCC" rx="4"/>
