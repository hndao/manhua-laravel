<svg width="768" height="1800" viewBox="0 0 768 1800" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
    .label { font-family: Arial, sans-serif; font-size: 12px; fill: #555; }
    .small { font-family: Arial, sans-serif; font-size: 11px; fill: #777; }
  </style>

  <rect width="768" height="1800" fill="#F7F7F7"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="768" height="64" fill="#FFFFFF" stroke="#DDDDDD"/>
  <rect x="24" y="16" width="120" height="32" fill="#FFFFFF" stroke="#CCCCCC"/>
  <text x="32" y="37" class="small">LOGO</text>

  <text x="170" y="39" class="small">首页</text>
  <text x="220" y="39" class="small">排行榜</text>
  <text x="290" y="39" class="small">分类</text>

  <rect x="420" y="16" width="230" height="32" fill="#FFFFFF" stroke="#CCCCCC" rx="16"/>
  <text x="430" y="37" class="small">Search...</text>

  <rect x="670" y="16" width="70" height="32" fill="#FFFFFF" stroke="#CCCCCC" rx="4"/>
