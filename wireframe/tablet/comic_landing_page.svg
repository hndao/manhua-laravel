  <text x="44" y="1450" class="label">1.</text>
  <rect x="60" y="1435" width="50" height="70" fill="#FFFFFF" stroke="#CCCCCC" rx="4"/>
  <text x="120" y="1456" class="label">Title 1</text>
  <text x="120" y="1474" class="small">Views 1.2M</text>

  <text x="44" y="1528" class="label">2.</text>
  <rect x="60" y="1513" width="50" height="70" fill="#FFFFFF" stroke="#CCCCCC" rx="4"/>
  <text x="120" y="1534" class="label">Title 2</text>
  <text x="120" y="1552" class="small">Views 980K</text>

  <!-- Footer -->
  <rect x="0" y="1700" width="768" height="100" fill="#FFFFFF" stroke="#DDDDDD"/>
  <text x="24" y="1728" class="small">关于我们 | 使用条款 | 隐私政策</text>
