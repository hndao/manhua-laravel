  <!-- BANNER -->
  <text x="24" y="110" class="title">Banner</text>
  <rect x="24" y="120" width="720" height="260" fill="#FFFFFF" stroke="#DDDDDD" rx="8"/>
  <circle cx="374" cy="390" r="4" fill="#BBBBBB"/>
  <circle cx="394" cy="390" r="4" fill="#DDDDDD"/>
  <circle cx="414" cy="390" r="4" fill="#DDDDDD"/>

  <!-- Editor Picks -->
  <text x="24" y="440" class="title">编辑推荐 / Editor Picks</text>
  <rect x="24" y="450" width="720" height="220" fill="#FFFFFF" stroke="#DDDDDD" rx="8"/>

  <!-- 4 items (2×2) -->
  <!-- Row 1 -->
  <rect x="36" y="465" width="150" height="120" fill="#FFFFFF" stroke="#CCCCCC" rx="4"/>
  <text x="40" y="607" class="small">Title 1</text>

  <rect x="214" y="465" width="150" height="120" fill="#FFFFFF" stroke="#CCCCCC" rx="4"/>
  <text x="218" y="607" class="small">Title 2</text>

  <rect x="392" y="465" width="150" height="120" fill="#FFFFFF" stroke="#CCCCCC" rx="4"/>
  <text x="396" y="607" class="small">Title 3</text>

  <rect x="570" y="465" width="150" height="120" fill="#FFFFFF" stroke="#CCCCCC" rx="4"/>
  <text x="574" y="607" class="small">Title 4</text>

