<svg width="375" height="1600" viewBox="0 0 375 1600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
    .label { font-family: Arial, sans-serif; font-size: 12px; fill: #555; }
    .small { font-family: Arial, sans-serif; font-size: 11px; fill: #777; }
  </style>

  <!-- Background -->
  <rect width="375" height="1600" fill="#F7F7F7"/>

  <!-- Header (optional sticky bar) -->
  <rect x="0" y="0" width="375" height="56" fill="#FFFFFF" stroke="#DDDDDD"/>
  <text x="12" y="34" class="small">←</text>
  <text x="188" y="34" text-anchor="middle" class="small">作品详情 / Detail</text>
  <text x="340" y="34" class="small">···</text>

  <!-- Top info block -->
  <rect x="0" y="56" width="375" height="260" fill="#FFFFFF" stroke="#DDDDDD"/>

  <!-- Cover (centered) -->
  <rect x="20" y="68" width="110" height="160" fill="#FFFFFF" stroke="#CCCCCC" rx="4"/>
  <text x="75" y="152" text-anchor="middle" class="small">Cover</text>

  <!-- Info right to cover -->
  <text x="140" y="88" class="title">漫画标题</text>
  <text x="140" y="112" class="label">作者: Author Name</text>
  <text x="140" y="134" class="label">类型: 热血 · 冒险 · 奇幻</text>
  <text x="140" y="156" class="label">状态: 连载中</text>

  <!-- Stats row -->
  <text x="140" y="182" class="small">人气 1.2亿</text>
  <text x="230" y="182" class="small">收藏 340万</text>

  <!-- Buttons -->
  <rect x="20" y="208" width="160" height="36" fill="#FFFEFE" stroke="#333333" rx="18"/>
  <text x="100" y="230" text-anchor="middle" class="small">开始阅读 / Start</text>

  <rect x="200" y="208" width="155" height="36" fill="#FFFFFF" stroke="#999999" rx="18"/>
  <text x="278" y="230" text-anchor="middle" class="small">收藏 / Bookmark</text>

  <!-- Intro block -->
  <rect x="0" y="316" width="375" height="150" fill="#FFFFFF" stroke="#DDDDDD"/>
  <text x="20" y="340" class="label">简介 / Introduction</text>
  <text x="20" y="362" class="small">这是漫画简介的占位文本，用来展示简介多行效果...</text>
  <text x="20" y="382" class="small">It can be 2–3 lines on mobile layout....</text>
  <text x="20" y="402" class="small">[展开 / More]</text>

  <!-- Chapter header -->
  <rect x="0" y="466" width="375" height="40" fill="#FFFFFF" stroke="#DDDDDD"/>
  <text x="20" y="492" class="label">章节列表 / Chapters</text>
  <text x="300" y="492" class="small">倒序</text>
  <text x="338" y="492" class="small">⇅</text>

  <!-- Chapter list (scroll area) -->
  <rect x="0" y="506" width="375" height="820" fill="#FFFFFF" stroke="#DDDDDD"/>

  <!-- Chapter row template -->
  <!-- Row 1 -->
  <rect x="12" y="520" width="351" height="64" fill="#FFFFFF" stroke="#EEEEEE" rx="6"/>
  <text x="24" y="544" class="label">第 1 话 · Chapter 1</text>
  <text x="24" y="564" class="small">更新: 2025-01-01</text>
  <text x="320" y="544" class="small">▶</text>

  <!-- Row 2 -->
  <rect x="12" y="592" width="351" height="64" fill="#FFFFFF" stroke="#EEEEEE" rx="6"/>
  <text x="24" y="616" class="label">第 2 话 · Chapter 2</text>
  <text x="24" y="636" class="small">更新: 2025-01-03</text>
  <text x="320" y="616" class="small">▶</text>

  <!-- Row 3 -->
  <rect x="12" y="664" width="351" height="64" fill="#FFFFFF" stroke="#EEEEEE" rx="6"/>
  <text x="24" y="688" class="label">第 3 话 · Chapter 3</text>
  <text x="24" y="708" class="small">更新: 2025-01-05</text>
  <text x="320" y="688" class="small">▶</text>

  <!-- Row 4 -->
  <rect x="12" y="736" width="351" height="64" fill="#FFFFFF" stroke="#EEEEEE" rx="6"/>
  <text x="24" y="760" class="label">第 4 话 · Chapter 4</text>
  <text x="24" y="780" class="small">更新: 2025-01-07</text>
  <text x="320" y="760" class="small">▶</text>

  <!-- Row 5 -->
  <rect x="12" y="808" width="351" height="64" fill="#FFFFFF" stroke="#EEEEEE" rx="6"/>
  <text x="24" y="832" class="label">第 5 话 · Chapter 5</text>
  <text x="24" y="852" class="small">更新: 2025-01-09</text>
  <text x="320" y="832" class="small">▶</text>

  <!-- Pagination / Load more -->
  <rect x="112" y="1290" width="150" height="36" fill="#FFFFFF" stroke="#333333" rx="18"/>
  <text x="187" y="1312" text-anchor="middle" class="small">加载更多 / More</text>

  <!-- Bottom recommended area -->
  <rect x="0" y="1350" width="375" height="200" fill="#FFFFFF" stroke="#DDDDDD"/>
  <text x="20" y="1374" class="label">猜你喜欢 / You may like</text>

  <rect x="20" y="1388" width="90" height="120" fill="#FFFFFF" stroke="#CCCCCC" rx="4"/>
  <text x="22" y="1520" class="small">Comic A</text>

  <rect x="142" y="1388" width="90" height="120" fill="#FFFFFF" stroke="#CCCCCC" rx="4"/>
  <text x="144" y="1520" class="small">Comic B</text>

  <rect x="264" y="1388" width="90" height="120" fill="#FFFFFF" stroke="#CCCCCC" rx="4"/>
  <text x="266" y="1520" class="small">Comic C</text>
</svg>
